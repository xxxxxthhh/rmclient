[project]
name = "rmclient"
version = "0.2.1"
description = "Local web UI + CLI for self-hosted rmfakecloud: push books to your reMarkable, manage the document tree, preview notebooks"
readme = "README.md"
license = "MIT"
keywords = ["remarkable", "rmfakecloud", "remarkable-tablet", "self-hosted"]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "python-multipart>=0.0.32",
    "rmscene>=0.8.0",
    "uvicorn>=0.52.4",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[project.urls]
Repository = "https://github.com/xxxxxthhh/rmclient"
Issues = "https://github.com/xxxxxthhh/rmclient/issues"
Changelog = "https://github.com/xxxxxthhh/rmclient/releases"

[project.scripts]
rmclient = "rmclient.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rmclient"]

[tool.pytest.ini_options]
testpaths = ["tests"]
