<!doctype html>
<meta charset="utf-8"><title>rmclient — 笔记预览</title>
<link rel="stylesheet" href="/static/app.css">
<style>
 .page{margin:var(--sp-5) 0}
 .page img{width:100%;border:1px solid var(--line);border-radius:var(--radius);background:#fff}
 .num{color:var(--ink-3);font-size:.85em}
 .msg{padding:var(--sp-3) var(--sp-4);border-radius:var(--radius);margin:var(--sp-4) 0;white-space:pre-wrap}
 .err{background:var(--danger-soft)}
</style>
<header class="topbar">
  <a class="brand" href="/tree">
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="1.7" stroke-linecap="round" aria-hidden="true">
      <rect x="4.5" y="2.5" width="15" height="19" rx="2.5"/><path d="M8.5 8h7M8.5 12h7M8.5 16h4"/>
    </svg>
    rmclient
  </a>
  <nav class="tabs" aria-label="页面导航">
    <a class="tab" href="/">推书</a>
    <a class="tab" href="/tree">文档树</a>
  </nav>
  <span class="crumb" id="crumb"><span id="title">读取中…</span></span>
  <span class="spacer"></span>
  <span class="meta mono" id="count"></span>
  <a class="button" id="pdf" hidden>导出 PDF</a>
</header>
<main>
<div id="log"></div>
<div id="pages"></div>
</main>
<script>
const docId = location.pathname.split('/').pop();

async function load() {
  const r = await fetch(`/api/preview/${docId}`);
  const d = await r.json().catch(() => ({}));
  if (!r.ok) {
    document.getElementById('title').textContent = '打不开';
    const box = document.createElement('div');
    box.className = 'msg err';
    box.textContent = (d.detail && d.detail.message) || `失败：HTTP ${r.status}`;
    document.getElementById('log').append(box);
    return;
  }
  document.title = `${d.name} — rmclient`;
  document.getElementById('title').textContent = d.name;
  document.getElementById('count').textContent = `${d.pages} 页 · ${d.fileType}`;
  const pdf = document.getElementById('pdf');
  pdf.href = `/api/preview/${docId}/pdf`;
  pdf.hidden = false;

  const box = document.getElementById('pages');
  for (let n = 1; n <= d.pages; n++) {
    const wrap = document.createElement('div');
    wrap.className = 'page';
    const num = document.createElement('div');
    num.className = 'num';
    num.textContent = `第 ${n} / ${d.pages} 页`;
    const img = document.createElement('img');
    img.loading = 'lazy';
    img.alt = `第 ${n} 页`;
    img.src = `/api/preview/${docId}/page/${n}`;
    wrap.append(num, img);
    box.append(wrap);
  }
}

load();
</script>
