<!doctype html>
<meta charset="utf-8"><title>rmclient — 推书</title>
<link rel="stylesheet" href="/static/app.css">
<style>
 .dropzone{width:100%;display:flex;flex-direction:column;align-items:center;gap:var(--sp-2);
           padding:var(--sp-6) var(--sp-4);border:2px dashed var(--line-2);border-radius:var(--radius-lg);
           background:var(--surface);color:var(--ink-2);cursor:pointer;transition:.14s}
 .dropzone:hover{border-color:var(--ink-3);background:var(--surface-2)}
 .dropzone.hot{border-color:var(--accent);background:var(--accent-soft);color:var(--ink);
               transform:scale(1.01)}
 .dropzone .big{font-size:1.05rem;font-weight:600;color:var(--ink)}
 .dropzone svg{color:var(--accent)}
 .row{margin:var(--sp-4) 0;display:flex;gap:var(--sp-3);align-items:center;flex-wrap:wrap}
 .row select{flex:1;min-width:14rem}
 .check{display:inline-flex;align-items:center;gap:var(--sp-1);color:var(--ink-2)}
 .check input{accent-color:var(--accent)}
 #queue{margin-top:var(--sp-4);display:flex;flex-direction:column;gap:var(--sp-2)}
 .card{border:1px solid var(--line);border-left:3px solid var(--line-2);border-radius:var(--radius);
       background:var(--surface);padding:var(--sp-3);box-shadow:var(--shadow-1)}
 .card.ok{border-left-color:var(--ok);background:var(--ok-soft)}
 .card.err{border-left-color:var(--danger);background:var(--danger-soft)}
 .card.warn{border-left-color:var(--warn);background:var(--warn-soft)}
 .card .head{display:flex;align-items:center;gap:var(--sp-2)}
 .card .file{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
 .card .chip{margin-left:auto;flex:none}
 .card .detail{margin-top:var(--sp-1);white-space:pre-wrap}
 .bar{height:3px;margin-top:var(--sp-2);border-radius:999px;background:var(--surface-2);overflow:hidden}
 .bar i{display:block;height:100%;width:40%;border-radius:999px;background:var(--accent);
        animation:slide 1.1s ease-in-out infinite}
 @keyframes slide{0%{margin-left:-40%}100%{margin-left:100%}}
</style>
<header class="topbar">
  <a class="brand" href="/tree">
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="1.7" stroke-linecap="round" aria-hidden="true">
      <rect x="4.5" y="2.5" width="15" height="19" rx="2.5"/><path d="M8.5 8h7M8.5 12h7M8.5 16h4"/>
    </svg>
    rmclient
  </a>
  <nav class="tabs" aria-label="页面导航">
    <a class="tab" href="/" aria-current="page">推书</a>
    <a class="tab" href="/tree">文档树</a>
  </nav>
  <span class="crumb" id="crumb">推书</span>
  <span class="spacer"></span>
</header>
<main class="narrow">
<h1>推书到 reMarkable</h1>
<div class="row">
  <label for="parent">目标目录</label>
  <select id="parent"></select>
  <label class="check"><input type="checkbox" id="force"> 重名也传</label>
</div>
<button type="button" id="drop" class="dropzone">
  <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor"
       stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M12 15V4"/><path d="M8 8l4-4 4 4"/><path d="M4 15v3.5A1.5 1.5 0 0 0 5.5 20h13a1.5 1.5 0 0 0 1.5-1.5V15"/>
  </svg>
  <span class="big">把 .epub / .pdf / .rmdoc 拖到这里</span>
  <span class="meta">或点击选择文件。后缀必须和内容一致——服务端不校验，本机会先拒掉。</span>
</button>
<input type="file" id="picker" hidden multiple accept=".epub,.pdf,.rmdoc">
<div id="queue"></div>
</main>
<div id="toasts" aria-live="polite"></div>
<script>
const drop = document.getElementById('drop'), picker = document.getElementById('picker'),
      parent = document.getElementById('parent'), force = document.getElementById('force'),
      queue = document.getElementById('queue');

const el = (tag, cls, text) => {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined) n.textContent = text;
  return n;
};

// 和 /tree 一样的右上角 toast：报错留着等人读完再关。
function say(cls, text) {
  const box = document.getElementById('toasts');
  const card = el('div', 'toast ' + cls, text);
  const close = el('button', 'close', '×');
  close.setAttribute('aria-label', '关闭');
  close.onclick = () => card.remove();
  card.append(close);
  box.prepend(card);
  if (cls !== 'err') setTimeout(() => card.remove(), 7000);
}

fetch('/api/folders').then(r => r.json()).then(d => {
  for (const f of d.folders) {
    const o = document.createElement('option');
    o.value = f.id; o.textContent = f.path; parent.append(o);
  }
}).catch(() => say('err', '读不到文档树，看下终端里的报错'));

// 逐文件一张卡片：上传中是进度条，完事变成结果。
function newCard(file) {
  const card = el('div', 'card');
  const head = el('div', 'head');
  head.append(el('span', 'file', file.name));
  const chip = el('span', 'chip badge', '上传中');
  head.append(chip);
  card.append(head);
  const bar = el('div', 'bar');
  bar.append(el('i'));
  card.append(bar);
  const detail = el('div', 'detail meta');
  card.append(detail);
  queue.prepend(card);
  return {
    done(state, label, text) {
      card.className = 'card ' + state;
      chip.textContent = label;
      bar.remove();
      detail.textContent = text;
    },
  };
}

async function upload(file) {
  const target = parent.options[parent.selectedIndex].text;
  const card = newCard(file);
  const body = new FormData();
  body.append('file', file);
  body.append('parent', parent.value);
  body.append('force', force.checked ? 'true' : 'false');

  const r = await fetch('/api/upload', {method: 'POST', body});
  const d = await r.json().catch(() => ({}));
  if (r.ok) {
    card.done('ok', '已上传', `「${d.name}」→ ${target}\n` +
      (d.duplicates ? `⚠ 同名的还有 ${d.duplicates} 份，设备端会看到 ${d.duplicates + 1} 本同名书\n` : '') +
      '设备端需要同步一次才会出现');
    return;
  }
  const detail = d.detail || {};
  if (detail.reason === 'duplicate') {
    const copies = (detail.existing || []).length;
    card.done('warn', '重名未传', `${target} 里已经有 ${copies} 份同名的书。\n` +
      '服务端不覆盖也不去重：再传会多出一份独立副本，设备端两本无法区分。\n' +
      '确实要传：勾上「重名也传」再拖一次。');
    return;
  }
  card.done('err', '被拒绝', detail.message || `失败：HTTP ${r.status}`);
}

async function uploadAll(files) {
  for (const file of files) await upload(file);
}

drop.onclick = () => picker.click();
picker.onchange = () => { uploadAll([...picker.files]); picker.value = ''; };
drop.ondragover = e => { e.preventDefault(); drop.classList.add('hot'); };
drop.ondragleave = () => drop.classList.remove('hot');
drop.ondrop = e => {
  e.preventDefault(); drop.classList.remove('hot');
  uploadAll([...e.dataTransfer.files]);
};
</script>
