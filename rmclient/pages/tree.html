<!doctype html>
<html lang="en">
<meta charset="utf-8"><title data-i18n="tree.title">rmclient — Document tree</title>
<link rel="stylesheet" href="/static/app.css">
<script src="/static/i18n.js"></script>
<style>
 #toolbar{position:sticky;top:var(--topbar-h);z-index:15;display:flex;gap:var(--sp-2);
          align-items:center;flex-wrap:wrap;margin:0 0 var(--sp-4);padding:var(--sp-2) 0;
          background:color-mix(in srgb, var(--paper) 92%, transparent);backdrop-filter:blur(6px)}
 #search{flex:1;min-width:12rem}

 .row{position:relative;display:flex;align-items:center;gap:.4rem;padding:.12rem .4rem;
      border-radius:var(--radius-sm)}
 .row:hover{background:var(--surface-2)}
 .row .name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
 .row .tail{margin-left:auto;display:flex;align-items:center;gap:var(--sp-2);flex:none}
 .row .ico{color:var(--ink-3);flex:none;display:flex}
 .row .caret-gap{width:15px;flex:none}
 .row .pick-gap{width:13px;flex:none}
 details[open]>summary>.row>.ico{color:var(--accent)}
 .locked .row .ico{color:var(--warn)}

 .kids{margin-left:.85rem;border-left:1px dashed var(--line-2);padding-left:.7rem}
 summary{cursor:pointer;list-style:none}
 summary::-webkit-details-marker{display:none}
 summary .caret{color:var(--ink-3);flex:none;transition:transform .12s}
 details[open]>summary .caret{transform:rotate(90deg)}

 .hit{background:var(--warn-soft);border-radius:3px;padding:0 .15rem}
 .flash{animation:flash 2s ease-out}
 @keyframes flash{from{background:var(--warn-soft)}to{background:transparent}}

 .acts{position:absolute;right:.35rem;top:50%;transform:translateY(-50%);display:none;
       gap:.2rem;padding-left:.5rem;border-radius:var(--radius-sm);
       background:linear-gradient(90deg,transparent,var(--surface-2) 12%)}
 .row:hover .acts,.row:focus-within .acts{display:flex}
 .acts button{font-size:.78em;padding:.05rem .4rem}
 .pick{margin:0 .1rem 0 0;accent-color:var(--accent)}

 .batchdock{position:fixed;left:50%;bottom:var(--sp-5);transform:translateX(-50%);z-index:30;
            display:flex;gap:var(--sp-2);align-items:center;padding:var(--sp-2) var(--sp-4);
            border:1px solid var(--line-2);border-radius:999px;background:var(--surface);
            box-shadow:var(--shadow-2);animation:dock-in .16s ease-out}
 @keyframes dock-in{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1}}

 #pending .rec{font-size:.9em;color:var(--ink-2);padding:.05rem 0;display:flex;
               align-items:center;gap:var(--sp-2)}
 #dups .group{margin:var(--sp-3) 0}
 #dups .item{font-size:.92em;color:var(--ink-2);margin-left:var(--sp-4);display:flex;
             align-items:center;gap:var(--sp-2)}
 #trash-wrap{margin-top:var(--sp-5);color:var(--ink-3)}
 #trash-wrap>summary::before{content:"▸ ";color:var(--ink-3)}
 #trash-wrap[open]>summary::before{content:"▾ "}
 .skel-row{height:1.4rem;margin:.35rem 0}
</style>
<header class="topbar">
  <a class="brand" href="/tree">
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="1.7" stroke-linecap="round" aria-hidden="true">
      <rect x="4.5" y="2.5" width="15" height="19" rx="2.5"/><path d="M8.5 8h7M8.5 12h7M8.5 16h4"/>
    </svg>
    rmclient
  </a>
  <nav class="tabs" data-i18n-aria-label="nav.aria" aria-label="Page navigation">
    <a class="tab" href="/" data-i18n="nav.push">Push</a>
    <a class="tab" href="/tree" aria-current="page" data-i18n="nav.tree">Tree</a>
  </nav>
  <span class="crumb" id="crumb" data-i18n="tree.crumb">Document tree</span>
  <span class="spacer"></span>
  <div class="langpick" id="langpick" role="group"></div>
</header>
<main>
<div id="toolbar">
  <input id="search" type="search" data-i18n-placeholder="tree.search"
         placeholder="Search visible names (substring, case-insensitive)">
  <label class="meta" for="sort" data-i18n="tree.sort">Sort</label>
  <select id="sort">
    <option value="name" data-i18n="tree.sort.name">Name</option>
    <option value="modified" data-i18n="tree.sort.modified">Modified</option>
    <option value="size" data-i18n="tree.sort.size">Size</option>
  </select>
  <button id="mkroot" data-i18n="tree.newRoot">＋ New root folder</button>
  <button id="dupcheck" data-i18n="tree.dupCheck">Duplicate report</button>
  <button id="reload" data-i18n="tree.reload">Refresh</button>
</div>
<div id="batchbar" class="batchdock" role="region"
     data-i18n-aria-label="tree.batch.aria" aria-label="Batch actions" hidden></div>
<div id="dups" class="panel" hidden></div>
<div id="pending" class="panel attention" hidden></div>
<div id="log"></div>
<div id="tree" aria-busy="true"></div>
<details id="trash-wrap" hidden>
  <summary id="trash-summary"></summary>
  <div id="trash" class="kids"></div>
</details>
</main>
<div id="toasts" aria-live="polite"></div>
<input type="file" id="picker" hidden accept=".epub,.pdf,.rmdoc">
<script>
// ---- 小工具 ----

const el = (tag, cls, text) => {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined) n.textContent = text;
  return n;
};
const kb = n => n >= 1048576 ? (n / 1048576).toFixed(1) + 'MB' : Math.round(n / 1024) + 'KB';

const SVG = 'http://www.w3.org/2000/svg';
const PATHS = {
  folder: ['M3 6.5A1.5 1.5 0 0 1 4.5 5h3.2l1.4 1.8h6.4A1.5 1.5 0 0 1 17 8.3v6.2A1.5 1.5 0 0 1 15.5 16h-11A1.5 1.5 0 0 1 3 14.5z'],
  doc: ['M5.5 3h6l3.5 3.5v10.5H5.5z', 'M11.5 3v3.5H15'],
  caret: ['M8 5l5 5-5 5'],
};
function icon(kind, cls) {
  const svg = document.createElementNS(SVG, 'svg');
  svg.setAttribute('viewBox', '0 0 20 20');
  svg.setAttribute('width', '15'); svg.setAttribute('height', '15');
  svg.setAttribute('fill', 'none'); svg.setAttribute('stroke', 'currentColor');
  svg.setAttribute('stroke-width', '1.5'); svg.setAttribute('stroke-linejoin', 'round');
  svg.setAttribute('aria-hidden', 'true');
  if (cls) svg.setAttribute('class', cls);
  for (const d of PATHS[kind]) {
    const path = document.createElementNS(SVG, 'path');
    path.setAttribute('d', d);
    svg.append(path);
  }
  return svg;
}

// 反馈统一走右上角 toast：成功/提示自己淡出，报错留着等人读完再关。
function say(cls, text) {
  const box = document.getElementById('toasts');
  const card = el('div', 'toast ' + cls, text);
  const close = el('button', 'close', '×');
  close.setAttribute('aria-label', t('toast.close'));
  close.onclick = () => card.remove();
  card.append(close);
  box.prepend(card);
  if (cls !== 'err') setTimeout(() => card.remove(), 7000);
}

// ---- 状态 ----

let TREE = {entries: [], trash: []};
let INDEX = new Map();       // id -> {node, ancestors: [id...]}
const OPEN = new Set();      // 用户自己展开的目录（过滤时的自动展开不写进来）
const SELECTED = new Set();  // 多选（信箱子树与回收站没有勾选框）
let FILTER = '';
let SORT = 'name';

function reindex() {
  INDEX = new Map();
  const walk = (nodes, ancestors) => {
    for (const n of nodes) {
      INDEX.set(n.id, {node: n, ancestors});
      if (n.kind === 'folder') walk(n.children, [...ancestors, n.id]);
    }
  };
  walk(TREE.entries, []);
}

// ---- 过滤与排序 ----

function matches(node) {
  return !FILTER || node.name.toLowerCase().includes(FILTER);
}

function subtreeMatches(node) {
  if (matches(node)) return true;
  return node.kind === 'folder' && node.children.some(subtreeMatches);
}

function sorted(nodes) {
  const key = {
    name: (a, b) => a.name.localeCompare(b.name),
    modified: (a, b) => (b.lastModified || '').localeCompare(a.lastModified || ''),
    size: (a, b) => (b.size || 0) - (a.size || 0),
  }[SORT];
  // 目录永远在前，和排序方式无关。
  return [...nodes].sort((a, b) => (a.kind === b.kind) ? key(a, b) : (a.kind === 'folder' ? -1 : 1));
}

// ---- 渲染 ----

function actions(node, allowed) {
  const box = el('span', 'acts');
  const add = (label, fn, title) => {
    const b = el('button', null, label);
    if (title) b.title = title;
    b.onclick = e => { e.preventDefault(); e.stopPropagation(); fn(); };
    box.append(b);
  };
  // 只读操作：信箱里的文档也给（锁只针对写操作）；回收站不给。
  if (node.kind === 'doc' && allowed) {
    add(t('act.preview'), () => { location.href = '/preview/' + node.id; });
    add(t('act.download'), () => { location.href = '/api/download/' + node.id; },
        t('act.download.title'));
    add(t('act.package'), () => { location.href = '/api/download/' + node.id + '?package=1'; },
        t('act.package.title'));
  }
  if (node.locked || !allowed) return box;
  if (node.kind === 'folder') {
    add(t('act.newFolder'), () => askNewFolder(node.id, node.name));
    add(t('act.uploadHere'), () => pickAndUpload(node.id, node.name));
  }
  add(t('act.rename'), () => askRename(node));
  add(t('act.move'), () => askMove(node));
  add(t('act.delete'), () => askDelete([node.id], t('delete.label', {name: node.name})));
  return box;
}

function checkbox(node, allowed) {
  // 信箱子树和回收站不给勾选框——批量操作根本够不到它们。给个等宽占位保持对齐。
  if (node.locked || !allowed) return el('span', 'pick-gap');
  const box = el('input', 'pick');
  box.type = 'checkbox';
  box.checked = SELECTED.has(node.id);
  box.onclick = e => e.stopPropagation();   // 别把 <summary> 一起点开
  box.onchange = () => {
    box.checked ? SELECTED.add(node.id) : SELECTED.delete(node.id);
    drawBatchBar();
  };
  return box;
}

function nameSpan(node) {
  return el('span', 'name' + (matches(node) && FILTER ? ' hit' : ''), node.name);
}

function tail(...bits) {
  const box = el('span', 'tail');
  for (const b of bits) if (b) box.append(b);
  return box;
}

function renderDoc(node, allowed) {
  const wrap = el('div', 'node' + (node.locked ? ' locked' : ''));
  wrap.dataset.id = node.id;
  const row = el('div', 'row');
  row.append(el('span', 'caret-gap'));   // 和目录的折叠箭头对齐
  const pick = checkbox(node, allowed);
  if (pick) row.append(pick);
  row.append(el('span', 'ico'));
  row.lastChild.append(icon('doc'));
  row.append(nameSpan(node));
  row.append(tail(
    node.type ? el('span', 'badge', node.type) : null,
    el('span', 'meta mono', `${kb(node.size)} · ${(node.lastModified || '').slice(0, 10)}`),
    node.locked ? el('span', 'badge lock', t('badge.readonly')) : null,
    actions(node, allowed)));
  wrap.append(row);
  return wrap;
}

function renderFolder(node, allowed) {
  const box = el('details', 'node' + (node.locked ? ' locked' : ''));
  box.dataset.id = node.id;
  box.open = FILTER ? subtreeMatches(node) : OPEN.has(node.id);
  box.ontoggle = () => { if (!FILTER) box.open ? OPEN.add(node.id) : OPEN.delete(node.id); };
  const head = el('summary');
  const row = el('div', 'row');
  row.append(icon('caret', 'caret'));
  const pick = checkbox(node, allowed);
  if (pick) row.append(pick);
  row.append(el('span', 'ico'));
  row.lastChild.append(icon('folder'));
  row.append(nameSpan(node));
  row.append(tail(
    el('span', 'meta mono', t('tree.items', {n: node.children.length})),
    node.locked ? el('span', 'badge lock', t('badge.readonly')) : null,
    actions(node, allowed)));
  head.append(row);
  box.append(head);
  const kids = el('div', 'kids');
  renderInto(kids, node.children, allowed);
  box.append(kids);
  return box;
}

function renderInto(container, nodes, allowed = true) {
  container.textContent = '';
  const shown = sorted(nodes).filter(subtreeMatches);
  for (const node of shown) {
    container.append(node.kind === 'folder' ? renderFolder(node, allowed) : renderDoc(node, allowed));
  }
  if (!shown.length) {
    container.append(el('div', 'empty', FILTER
      ? t('tree.empty.filtered', {filter: FILTER})
      : t('tree.empty')));
  }
}

function drawBatchBar() {
  const bar = document.getElementById('batchbar');
  bar.hidden = !SELECTED.size;
  if (!SELECTED.size) return;
  bar.textContent = '';
  bar.append(el('strong', null, t('batch.selected', {n: SELECTED.size})));
  const add = (label, fn, cls) => {
    const b = el('button', cls, label);
    b.onclick = fn;
    bar.append(b);
  };
  add(t('act.move'), askMoveMany);
  add(t('act.delete'), () => askDelete([...SELECTED], t('batch.label', {n: SELECTED.size})), 'danger');
  add(t('dialog.cancel'), () => { SELECTED.clear(); drawBatchBar(); draw(); }, 'ghost');
}

function askMoveMany() {
  const exclude = new Set();
  for (const id of SELECTED) {
    const hit = INDEX.get(id);
    if (hit) collectIds(hit.node, exclude);   // 自己和自己的子孙都不能当目标
  }
  const picked = [...SELECTED];
  dialog(t('move.many.title', {n: picked.length}), dlg => {
    const sel = el('select');
    for (const o of folderOptions(exclude)) {
      const opt = el('option', null, o.path); opt.value = o.id; sel.append(opt);
    }
    dlg.append(el('div', 'meta', t('move.many.note')), sel);
  }, t('move.confirm'), async dlg => {
    const parent = dlg.querySelector('select').value;
    const body = new FormData();
    for (const id of picked) body.append('ids', id);
    body.append('parent', parent);
    const r = await fetch('/api/move/batch', {method: 'POST', body});
    const d = await r.json().catch(() => ({}));
    if (!r.ok) { say('err', httpError(r.status, d.detail)); return; }
    const ok = d.results.filter(x => x.ok);
    const bad = d.results.filter(x => !x.ok);
    say(bad.length ? 'warn' : 'ok',
      t('move.many.done', {ok: ok.length, bad: bad.length}) + '\n' +
      d.results.map(x => `  ${x.ok ? '✓' : '✗'} ${x.name || x.id}${x.ok ? '' : ': ' + x.error}`).join('\n'));
    SELECTED.clear();
    drawBatchBar();
    await load();
  });
}

function draw() {
  renderInto(document.getElementById('tree'), TREE.entries);
  const wrap = document.getElementById('trash-wrap');
  wrap.hidden = !TREE.trash.length;
  document.getElementById('trash-summary').textContent =
    t('tree.trash', {n: TREE.trash.length});
  renderInto(document.getElementById('trash'), TREE.trash, false);  // 回收站只读
}

function showSkeleton() {
  const box = document.getElementById('tree');
  box.textContent = '';
  for (let i = 0; i < 6; i++) {
    const row = el('div', 'skeleton skel-row');
    row.style.width = `${45 + (i % 3) * 18}%`;
    box.append(row);
  }
}

async function load() {
  if (!TREE.entries.length) showSkeleton();
  const r = await fetch('/api/tree');
  if (!r.ok) { say('err', t('tree.loadFailed')); return; }
  TREE = await r.json();
  reindex();
  document.getElementById('tree').removeAttribute('aria-busy');
  for (const id of [...SELECTED]) if (!INDEX.has(id)) SELECTED.delete(id);  // 删掉/移走的别留在选中里
  drawBatchBar();
  draw();
}

// ---- 对话框 ----

function dialog(title, buildBody, confirmLabel, onConfirm, variant) {
  const dlg = el('dialog');
  dlg.append(el('h2', null, title));
  buildBody(dlg);
  const buttons = el('div', 'buttons');
  const cancel = el('button', null, t('dialog.cancel'));
  // variant='danger'：不可逆动作的确认按钮走实心红，不用强调绿。
  const ok = el('button', 'primary' + (variant ? ' ' + variant : ''), confirmLabel);
  cancel.onclick = () => dlg.close();
  ok.onclick = async () => { ok.disabled = true; await onConfirm(dlg); dlg.remove(); };
  buttons.append(cancel, ok);
  dlg.append(buttons);
  document.body.append(dlg);
  dlg.showModal();
  const first = dlg.querySelector('input,select');
  if (first) { first.focus(); if (first.select) first.select(); }
  return dlg;
}

async function call(url, fields, okText) {
  const body = new FormData();
  for (const [k, v] of Object.entries(fields)) {
    if (Array.isArray(v)) v.forEach(i => body.append(k, i));
    else body.append(k, v);
  }
  const r = await fetch(url, {method: 'POST', body});
  const d = await r.json().catch(() => ({}));
  if (r.ok) { say('ok', okText(d)); await load(); return d; }
  say('err', httpError(r.status, d.detail));
  return null;
}

function askNewFolder(parentId, parentName) {
  const title = parentId ? t('newFolder.title', {parent: parentName}) : t('newFolder.titleRoot');
  dialog(title, dlg => {
    const input = el('input'); input.placeholder = t('newFolder.placeholder'); dlg.append(input);
  }, t('newFolder.confirm'), async dlg => {
    const name = dlg.querySelector('input').value;
    await call('/api/folders', {name, parent: parentId}, d => t('newFolder.done', {name: d.name}));
  });
}

function askRename(node) {
  dialog(t('rename.title', {name: node.name}), dlg => {
    const input = el('input'); input.value = node.name; dlg.append(input);
  }, t('rename.confirm'), async dlg => {
    const name = dlg.querySelector('input').value;
    await call('/api/rename', {id: node.id, name}, d => t('rename.done', {name: d.name}));
  });
}

function collectIds(node, into = new Set()) {
  into.add(node.id);
  for (const c of node.children || []) collectIds(c, into);
  return into;
}

function folderOptions(exclude) {
  // 排除信箱子树、以及自己和自己的子孙（移进去会把整棵子树甩飞）。
  const out = [{id: '', path: t('folder.root')}];
  const walk = (nodes, prefix) => {
    for (const n of nodes) {
      if (n.kind !== 'folder' || n.locked) continue;
      const path = prefix + n.name;
      if (!exclude.has(n.id)) out.push({id: n.id, path});
      walk(n.children, path + '/');
    }
  };
  walk(TREE.entries, '');
  return out;
}

function askMove(node) {
  dialog(t('move.title', {name: node.name}), dlg => {
    const sel = el('select');
    for (const o of folderOptions(collectIds(node))) {
      const opt = el('option', null, o.path); opt.value = o.id; sel.append(opt);
    }
    dlg.append(el('div', 'meta', t('move.note')), sel);
  }, t('move.confirm'), async dlg => {
    const parent = dlg.querySelector('select').value;
    await call('/api/move', {id: node.id, parent}, () => t('move.done', {name: node.name}));
  });
}

// ---- 上传到指定目录（复用 / 页那套 /api/upload）----

let uploadTarget = null;

function pickAndUpload(parentId, parentName) {
  uploadTarget = {id: parentId, name: parentName};
  document.getElementById('picker').click();
}

document.getElementById('picker').onchange = async ev => {
  const files = [...ev.target.files];
  ev.target.value = '';
  for (const file of files) await uploadOne(file, false);
};

async function uploadOne(file, force) {
  const body = new FormData();
  body.append('file', file);
  body.append('parent', uploadTarget.id);
  body.append('force', force ? 'true' : 'false');
  const r = await fetch('/api/upload', {method: 'POST', body});
  const d = await r.json().catch(() => ({}));
  if (r.ok) {
    say('ok', t('upload.done', {name: d.name, target: uploadTarget.name}) +
      (d.duplicates
        ? '\n' + t('push.dupWarn', {copies: d.duplicates, total: d.duplicates + 1})
        : '') +
      '\n' + t('push.syncNote'));
    await load();
    return;
  }
  const detail = d.detail || {};
  if (detail.reason === 'duplicate') {
    dialog(t('upload.dupTitle', {target: uploadTarget.name}), dlg => {
      dlg.append(el('div', 'msg warn', t('upload.dupBody')));
      for (const e of detail.existing || []) {
        dlg.append(el('div', 'meta', t('upload.dupExisting', {id: e.id})));
      }
    }, t('upload.dupConfirm'), async () => { await uploadOne(file, true); });
    return;
  }
  say('err', httpError(r.status, detail));
}

// ---- 删除 ----

async function askDelete(roots, label) {
  const body = new FormData();
  for (const id of roots) body.append('roots', id);
  const r = await fetch('/api/delete/plan', {method: 'POST', body});
  const plan = await r.json().catch(() => ({}));
  if (!r.ok) { say('err', httpError(r.status, plan.detail)); return; }

  dialog(t('delete.title', {label}), dlg => {
    dlg.append(el('div', 'alarm', t('delete.alarm')));
    dlg.append(el('div', 'meta', t('delete.resurrect')));
    dlg.append(el('div', null, t('delete.count', {n: plan.items.length})));
    const list = el('div', 'scroller');
    for (const item of plan.items) {
      const line = item.kind === 'folder'
        ? `📁 ${item.name}/`
        : `· ${item.name}  [${item.type || '?'}, ${kb(item.size)}]`;
      list.append(el('div', 'node', '  '.repeat(item.depth) + line));
    }
    dlg.append(list);
  }, t('delete.confirm'), async () => {
    const form = new FormData();
    for (const id of roots) form.append('roots', id);
    for (const i of plan.ids) form.append('ids', i);
    const res = await fetch('/api/delete', {method: 'POST', body: form});
    const d = await res.json().catch(() => ({}));
    if (!res.ok) {
      const detail = d.detail || {};
      say('err', httpError(res.status, detail) +
        (detail.reason === 'tree_changed' ? t('delete.treeChanged') : ''));
      await load();
      return;
    }
    SELECTED.clear();
    drawBatchBar();
    say(d.residue.length ? 'err' : 'ok', d.residue.length
      ? t('delete.residue',
          {n: d.deleted.length, r: d.residue.length, ids: d.residue.join(', ')})
      : t('delete.done', {n: d.deleted.length}));
    await loadPending();
    await load();
  }, 'danger');
}

// ---- 重名检测（只报告，不给任何自动删除）----

async function showDuplicates() {
  const box = document.getElementById('dups');
  const r = await fetch('/api/duplicates');
  const d = await r.json().catch(() => ({groups: []}));
  if (!r.ok) { say('err', t('dups.failed')); return; }
  box.hidden = false;
  box.textContent = '';
  const groups = d.groups || [];
  box.append(el('h2', null, t('dups.title', {n: groups.length})));
  box.append(el('div', 'meta', t('dups.note')));
  for (const g of groups) {
    const wrap = el('div', 'group');
    wrap.append(el('div', null, t('dups.group', {name: g.name, n: g.items.length})));
    for (const item of g.items) {
      const line = el('div', 'item');
      const link = el('a', null, (item.path ? item.path + '/' : '') + item.name);
      link.onclick = () => jumpTo(item.id);
      line.append(link);
      line.append(el('span', 'meta',
        `[${item.type || '?'}, ${kb(item.size)}, ${(item.lastModified || '').slice(0, 10)}]`));
      if (item.locked) line.append(el('span', 'badge', t('badge.readonlyLock')));
      wrap.append(line);
    }
    box.append(wrap);
  }
  if (!groups.length) box.append(el('div', 'empty', t('dups.none')));
  const close = el('button', null, t('dups.close'));
  close.onclick = () => { box.hidden = true; };
  box.append(el('div', null), close);
}

function jumpTo(id) {
  const hit = INDEX.get(id);
  if (!hit) return;
  FILTER = '';
  document.getElementById('search').value = '';
  for (const ancestor of hit.ancestors) OPEN.add(ancestor);   // 展开祖先，否则滚过去也看不见
  draw();
  const row = document.querySelector(`[data-id="${CSS.escape(id)}"]`);
  if (!row) return;
  row.scrollIntoView({block: 'center', behavior: 'smooth'});
  row.classList.add('flash');
  setTimeout(() => row.classList.remove('flash'), 2000);
}

// ---- 待复查的删除记录（存在本地文件里，刷新页面也还在）----

async function loadPending() {
  const box = document.getElementById('pending');
  const r = await fetch('/api/deleted');
  if (!r.ok) { box.hidden = true; return; }
  const records = (await r.json()).records || [];
  box.hidden = !records.length;
  if (!records.length) return;

  box.textContent = '';
  box.append(el('h2', null, t('pending.title', {n: records.length})));
  box.append(el('div', 'meta', t('pending.note')));
  for (const rec of records) {
    const line = el('div', 'rec');
    const where = rec.path ? rec.path + '/' : '';
    line.append(el('span', null,
      `${rec.kind === 'folder' ? '📁' : '·'} ${where}${rec.name}  ${rec.id}  ${(rec.deleted_at || '').replace('T', ' ').slice(0, 19)}`));
    const drop = el('button', null, t('pending.clear'));
    drop.onclick = () => clearRecords([rec.id]);
    line.append(document.createTextNode(' '), drop);
    box.append(line);
  }
  const check = el('button', null, t('pending.recheck'));
  check.onclick = recheck;
  const clearAll = el('button', null, t('pending.clearAll'));
  clearAll.onclick = () => clearRecords(null);
  box.append(el('div', null), check, clearAll);
}

async function recheck() {
  const r = await fetch('/api/resurrection', {method: 'POST'});
  const d = await r.json().catch(() => ({back: [], checked: 0}));
  if (!r.ok) { say('err', t('recheck.failed')); return; }
  say(d.back.length ? 'err' : 'ok', d.back.length
    ? t('recheck.back', {n: d.back.length}) + '\n' +
      d.back.map(b => `  ${b.id}  ${b.path ? b.path + '/' : ''}${b.name}`).join('\n') +
      t('recheck.backTail')
    : t('recheck.clean', {n: d.checked}));
  await load();
}

async function clearRecords(ids) {
  const body = new FormData();
  for (const i of ids || []) body.append('ids', i);
  await fetch('/api/deleted/clear', {method: 'POST', body});
  await loadPending();
}
