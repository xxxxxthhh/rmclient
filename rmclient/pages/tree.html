<!doctype html>
<meta charset="utf-8"><title>rmclient — 文档树</title>
<style>
 body{font:15px/1.6 system-ui,sans-serif;max-width:58rem;margin:2rem auto;padding:0 1rem;color:#222}
 h1{font-size:1.3rem;margin:.2rem 0}
 nav{color:#888;margin-bottom:.5rem}
 nav a{color:#345;text-decoration:none;margin-right:.2rem}
 #toolbar{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap;margin:.6rem 0 1rem}
 #search{flex:1;min-width:12rem;font:inherit;padding:.3rem .5rem;border:1px solid #ccc;border-radius:6px}
 #toolbar select,#toolbar button{font:inherit;padding:.25rem .7rem;cursor:pointer;
   border:1px solid #ccc;border-radius:6px;background:#fafafa}
 .node{padding:.1rem 0}
 .kids{margin-left:1.1rem;border-left:1px solid #eee;padding-left:.6rem}
 summary{cursor:pointer;list-style:none}
 summary::-webkit-details-marker{display:none}
 summary::before{content:"▸ ";color:#999}
 details[open]>summary::before{content:"▾ "}
 .meta{color:#888;font-size:.85em;margin-left:.4rem}
 .locked{opacity:.62}
 .badge{background:#eee;color:#666;border-radius:4px;padding:0 .35rem;font-size:.75em;margin-left:.35rem}
 .hit{background:#fff3bf;border-radius:3px}
 .flash{animation:flash 2s ease-out}
 @keyframes flash{from{background:#ffe066}to{background:transparent}}
 .msg{padding:.7rem 1rem;border-radius:8px;margin:.6rem 0;white-space:pre-wrap}
 .err{background:#fdecea}.ok{background:#e8f5e9}.warn{background:#fff8e1}
 #trash{color:#777}
 #dups{background:#f4f4f8;border-radius:8px;padding:.8rem 1rem;margin:.6rem 0}
 #dups h2{font-size:1rem;margin:0 0 .4rem}
 #dups .group{margin:.5rem 0}
 #dups .item{font-size:.9em;color:#555;margin-left:1rem}
 #dups a{color:#345;cursor:pointer;text-decoration:underline}
 #dups button{font:inherit;font-size:.85em;padding:.15rem .6rem;cursor:pointer;
              border:1px solid #ccc;border-radius:5px;background:#fff}
 #batchbar{background:#eef4ff;border-radius:8px;padding:.5rem .9rem;margin:.4rem 0;
           display:flex;gap:.5rem;align-items:center;flex-wrap:wrap}
 #batchbar button{font:inherit;font-size:.9em;padding:.2rem .7rem;cursor:pointer;
                  border:1px solid #ccc;border-radius:5px;background:#fff}
 .pick{margin-right:.35rem}
 .acts{margin-left:.5rem;visibility:hidden}
 .node:hover>.acts,.node:hover>summary>.acts{visibility:visible}
 .acts button{font:inherit;font-size:.8em;margin-left:.25rem;padding:0 .4rem;cursor:pointer;
              border:1px solid #ccc;border-radius:4px;background:#fafafa;color:#345}
 dialog{border:none;border-radius:10px;padding:1.2rem 1.4rem;max-width:38rem;
        box-shadow:0 8px 30px rgba(0,0,0,.2)}
 dialog h2{font-size:1.05rem;margin:.2rem 0 .8rem}
 dialog input,dialog select{font:inherit;width:100%;padding:.35rem;margin:.3rem 0 .8rem}
 dialog .buttons{display:flex;gap:.5rem;justify-content:flex-end}
 dialog button{font:inherit;padding:.3rem .9rem;cursor:pointer;border-radius:6px;border:1px solid #ccc}
 dialog button.primary{background:#345;color:#fff;border-color:#345}
 #pending{background:#fff8e1;border-radius:8px;padding:.8rem 1rem;margin:.6rem 0}
 #pending h2{font-size:1rem;margin:0 0 .4rem}
 #pending .rec{font-size:.9em;color:#555;padding:.05rem 0}
 #pending button{font:inherit;font-size:.85em;padding:.15rem .6rem;margin-right:.4rem;
                 cursor:pointer;border:1px solid #ccc;border-radius:5px;background:#fff}
</style>
<nav><a href="/">推书</a> · <a href="/tree">文档树</a></nav>
<h1>文档树</h1>
<div id="toolbar">
  <input id="search" type="search" placeholder="搜索可见名（子串，不分大小写）">
  <label class="meta">排序</label>
  <select id="sort">
    <option value="name">名字</option>
    <option value="modified">修改时间</option>
    <option value="size">大小</option>
  </select>
  <button id="mkroot">＋ 新建根级目录</button>
  <button id="dupcheck">重名检测</button>
  <button id="reload">刷新</button>
</div>
<div id="batchbar" hidden></div>
<div id="dups" hidden></div>
<div id="pending" hidden></div>
<div id="log"></div>
<div id="tree">读取中…</div>
<details id="trash-wrap" hidden>
  <summary>回收站（<span id="trash-count">0</span> 项，只读）</summary>
  <div id="trash" class="kids"></div>
</details>
<input type="file" id="picker" hidden accept=".epub,.pdf,.rmdoc">
<script>
// ---- 小工具 ----

const el = (tag, cls, text) => {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined) n.textContent = text;
  return n;
};
const kb = n => n >= 1048576 ? (n / 1048576).toFixed(1) + 'MB' : Math.round(n / 1024) + 'KB';
const say = (cls, text) => document.getElementById('log').prepend(el('div', 'msg ' + cls, text));

// ---- 状态 ----

let TREE = {entries: [], trash: []};
let INDEX = new Map();       // id -> {node, ancestors: [id...]}
const OPEN = new Set();      // 用户自己展开的目录（过滤时的自动展开不写进来）
const SELECTED = new Set();  // 多选（信箱子树与回收站没有勾选框）
let FILTER = '';
let SORT = 'name';

function reindex() {
  INDEX = new Map();
  const walk = (nodes, ancestors) => {
    for (const n of nodes) {
      INDEX.set(n.id, {node: n, ancestors});
      if (n.kind === 'folder') walk(n.children, [...ancestors, n.id]);
    }
  };
  walk(TREE.entries, []);
}

// ---- 过滤与排序 ----

function matches(node) {
  return !FILTER || node.name.toLowerCase().includes(FILTER);
}

function subtreeMatches(node) {
  if (matches(node)) return true;
  return node.kind === 'folder' && node.children.some(subtreeMatches);
}

function sorted(nodes) {
  const key = {
    name: (a, b) => a.name.localeCompare(b.name),
    modified: (a, b) => (b.lastModified || '').localeCompare(a.lastModified || ''),
    size: (a, b) => (b.size || 0) - (a.size || 0),
  }[SORT];
  // 目录永远在前，和排序方式无关。
  return [...nodes].sort((a, b) => (a.kind === b.kind) ? key(a, b) : (a.kind === 'folder' ? -1 : 1));
}

// ---- 渲染 ----

function actions(node, allowed) {
  const box = el('span', 'acts');
  const add = (label, fn) => {
    const b = el('button', null, label);
    b.onclick = e => { e.preventDefault(); e.stopPropagation(); fn(); };
    box.append(b);
  };
  // 只读操作：信箱里的文档也给（锁只针对写操作）；回收站不给。
  if (node.kind === 'doc' && allowed) {
    add('预览', () => { location.href = '/preview/' + node.id; });
    add('下载', () => { location.href = '/api/download/' + node.id; });
  }
  if (node.locked || !allowed) return box;
  if (node.kind === 'folder') {
    add('＋目录', () => askNewFolder(node.id, node.name));
    add('传到这里', () => pickAndUpload(node.id, node.name));
  }
  add('重命名', () => askRename(node));
  add('移动', () => askMove(node));
  add('删除', () => askDelete([node.id], node.name));
  return box;
}

function checkbox(node, allowed) {
  // 信箱子树和回收站不给勾选框——批量操作根本够不到它们。
  if (node.locked || !allowed) return null;
  const box = el('input', 'pick');
  box.type = 'checkbox';
  box.checked = SELECTED.has(node.id);
  box.onclick = e => e.stopPropagation();   // 别把 <summary> 一起点开
  box.onchange = () => {
    box.checked ? SELECTED.add(node.id) : SELECTED.delete(node.id);
    drawBatchBar();
  };
  return box;
}

function renderDoc(node, allowed) {
  const row = el('div', 'node' + (node.locked ? ' locked' : ''));
  row.dataset.id = node.id;
  const pick = checkbox(node, allowed);
  if (pick) row.append(pick);
  const label = el('span', matches(node) && FILTER ? 'hit' : null, '· ' + node.name);
  row.append(label);
  row.append(el('span', 'meta',
    `[${node.type || '?'}, ${kb(node.size)}, ${(node.lastModified || '').slice(0, 10)}]`));
  if (node.locked) row.append(el('span', 'badge', '🔒 只读'));
  row.append(actions(node, allowed));
  return row;
}

function renderFolder(node, allowed) {
  const box = el('details', 'node' + (node.locked ? ' locked' : ''));
  box.dataset.id = node.id;
  box.open = FILTER ? subtreeMatches(node) : OPEN.has(node.id);
  box.ontoggle = () => { if (!FILTER) box.open ? OPEN.add(node.id) : OPEN.delete(node.id); };
  const head = el('summary');
  const pick = checkbox(node, allowed);
  if (pick) head.append(pick);
  head.append(el('span', matches(node) && FILTER ? 'hit' : null, '📁 ' + node.name));
  head.append(el('span', 'meta', `(${node.children.length})`));
  if (node.locked) head.append(el('span', 'badge', '🔒 只读'));
  head.append(actions(node, allowed));
  box.append(head);
  const kids = el('div', 'kids');
  renderInto(kids, node.children, allowed);
  box.append(kids);
  return box;
}

function renderInto(container, nodes, allowed = true) {
  container.textContent = '';
  const shown = sorted(nodes).filter(subtreeMatches);
  for (const node of shown) {
    container.append(node.kind === 'folder' ? renderFolder(node, allowed) : renderDoc(node, allowed));
  }
  if (!shown.length) container.append(el('div', 'meta', FILTER ? '（无匹配）' : '（空）'));
}

function drawBatchBar() {
  const bar = document.getElementById('batchbar');
  bar.hidden = !SELECTED.size;
  if (!SELECTED.size) return;
  bar.textContent = '';
  bar.append(el('span', null, `已选 ${SELECTED.size} 项`));
  const add = (label, fn) => { const b = el('button', null, label); b.onclick = fn; bar.append(b); };
  add('批量移动', askMoveMany);
  add('批量删除', () => askDelete([...SELECTED], `选中的 ${SELECTED.size} 项`));
  add('清空选择', () => { SELECTED.clear(); drawBatchBar(); draw(); });
}

function askMoveMany() {
  const exclude = new Set();
  for (const id of SELECTED) {
    const hit = INDEX.get(id);
    if (hit) collectIds(hit.node, exclude);   // 自己和自己的子孙都不能当目标
  }
  const picked = [...SELECTED];
  dialog(`移动选中的 ${picked.length} 项`, dlg => {
    const sel = el('select');
    for (const o of folderOptions(exclude)) {
      const opt = el('option', null, o.path); opt.value = o.id; sel.append(opt);
    }
    dlg.append(el('div', 'meta', '每一项的原名都会原样保留'), sel);
  }, '移动', async dlg => {
    const parent = dlg.querySelector('select').value;
    const body = new FormData();
    for (const id of picked) body.append('ids', id);
    body.append('parent', parent);
    const r = await fetch('/api/move/batch', {method: 'POST', body});
    const d = await r.json().catch(() => ({}));
    if (!r.ok) { say('err', (d.detail && d.detail.message) || `失败：HTTP ${r.status}`); return; }
    const ok = d.results.filter(x => x.ok);
    const bad = d.results.filter(x => !x.ok);
    say(bad.length ? 'warn' : 'ok',
      `移动完成：成功 ${ok.length} 项，失败 ${bad.length} 项\n` +
      d.results.map(x => `  ${x.ok ? '✓' : '✗'} ${x.name || x.id}${x.ok ? '' : '：' + x.error}`).join('\n'));
    SELECTED.clear();
    drawBatchBar();
    await load();
  });
}

function draw() {
  renderInto(document.getElementById('tree'), TREE.entries);
  const wrap = document.getElementById('trash-wrap');
  wrap.hidden = !TREE.trash.length;
  document.getElementById('trash-count').textContent = TREE.trash.length;
  renderInto(document.getElementById('trash'), TREE.trash, false);  // 回收站只读
}

async function load() {
  const r = await fetch('/api/tree');
  if (!r.ok) { say('err', '读不到文档树，看下终端里的报错'); return; }
  TREE = await r.json();
  reindex();
  for (const id of [...SELECTED]) if (!INDEX.has(id)) SELECTED.delete(id);  // 删掉/移走的别留在选中里
  drawBatchBar();
  draw();
}

// ---- 对话框 ----

function dialog(title, buildBody, confirmLabel, onConfirm) {
  const dlg = el('dialog');
  dlg.append(el('h2', null, title));
  buildBody(dlg);
  const buttons = el('div', 'buttons');
  const cancel = el('button', null, '取消');
  const ok = el('button', 'primary', confirmLabel);
  cancel.onclick = () => dlg.close();
  ok.onclick = async () => { ok.disabled = true; await onConfirm(dlg); dlg.remove(); };
  buttons.append(cancel, ok);
  dlg.append(buttons);
  document.body.append(dlg);
  dlg.showModal();
  const first = dlg.querySelector('input,select');
  if (first) { first.focus(); if (first.select) first.select(); }
  return dlg;
}

async function call(url, fields, okText) {
  const body = new FormData();
  for (const [k, v] of Object.entries(fields)) {
    if (Array.isArray(v)) v.forEach(i => body.append(k, i));
    else body.append(k, v);
  }
  const r = await fetch(url, {method: 'POST', body});
  const d = await r.json().catch(() => ({}));
  if (r.ok) { say('ok', okText(d)); await load(); return d; }
  say('err', (d.detail && d.detail.message) || `失败：HTTP ${r.status}`);
  return null;
}

function askNewFolder(parentId, parentName) {
  dialog(`在「${parentName}」里新建目录`, dlg => {
    const input = el('input'); input.placeholder = '目录名'; dlg.append(input);
  }, '新建', async dlg => {
    const name = dlg.querySelector('input').value;
    await call('/api/folders', {name, parent: parentId}, d => `✓ 已新建目录「${d.name}」`);
  });
}

function askRename(node) {
  dialog(`重命名「${node.name}」`, dlg => {
    const input = el('input'); input.value = node.name; dlg.append(input);
  }, '重命名', async dlg => {
    const name = dlg.querySelector('input').value;
    await call('/api/rename', {id: node.id, name}, d => `✓ 已重命名为「${d.name}」`);
  });
}

function collectIds(node, into = new Set()) {
  into.add(node.id);
  for (const c of node.children || []) collectIds(c, into);
  return into;
}

function folderOptions(exclude) {
  // 排除信箱子树、以及自己和自己的子孙（移进去会把整棵子树甩飞）。
  const out = [{id: '', path: '（根级）'}];
  const walk = (nodes, prefix) => {
    for (const n of nodes) {
      if (n.kind !== 'folder' || n.locked) continue;
      const path = prefix + n.name;
      if (!exclude.has(n.id)) out.push({id: n.id, path});
      walk(n.children, path + '/');
    }
  };
  walk(TREE.entries, '');
  return out;
}

function askMove(node) {
  dialog(`移动「${node.name}」`, dlg => {
    const sel = el('select');
    for (const o of folderOptions(collectIds(node))) {
      const opt = el('option', null, o.path); opt.value = o.id; sel.append(opt);
    }
    dlg.append(el('div', 'meta', '原名会原样保留'), sel);
  }, '移动', async dlg => {
    const parent = dlg.querySelector('select').value;
    await call('/api/move', {id: node.id, parent}, () => `✓ 已移动「${node.name}」`);
  });
}

// ---- 上传到指定目录（复用 / 页那套 /api/upload）----

let uploadTarget = null;

function pickAndUpload(parentId, parentName) {
  uploadTarget = {id: parentId, name: parentName};
  document.getElementById('picker').click();
}

document.getElementById('picker').onchange = async ev => {
  const files = [...ev.target.files];
  ev.target.value = '';
  for (const file of files) await uploadOne(file, false);
};

async function uploadOne(file, force) {
  const body = new FormData();
  body.append('file', file);
  body.append('parent', uploadTarget.id);
  body.append('force', force ? 'true' : 'false');
  const r = await fetch('/api/upload', {method: 'POST', body});
  const d = await r.json().catch(() => ({}));
  if (r.ok) {
    say('ok', `✓ 已上传「${d.name}」→ ${uploadTarget.name}` +
      (d.duplicates ? `\n⚠ 同名的还有 ${d.duplicates} 份，设备端会看到 ${d.duplicates + 1} 本同名书` : '') +
      '\n设备端需要同步一次才会出现');
    await load();
    return;
  }
  const detail = d.detail || {};
  if (detail.reason === 'duplicate') {
    dialog(`「${uploadTarget.name}」里已经有同名的书`, dlg => {
      dlg.append(el('div', 'msg warn',
        '服务端不覆盖也不去重：再传会多出一份独立副本，设备端两本无法区分。'));
      for (const e of detail.existing || []) dlg.append(el('div', 'meta', `已有：${e.id}`));
    }, '仍然上传', async () => { await uploadOne(file, true); });
    return;
  }
  say('err', detail.message || `上传失败：HTTP ${r.status}`);
}

// ---- 删除 ----

async function askDelete(roots, label) {
  const body = new FormData();
  for (const id of roots) body.append('roots', id);
  const r = await fetch('/api/delete/plan', {method: 'POST', body});
  const plan = await r.json().catch(() => ({}));
  if (!r.ok) { say('err', (plan.detail && plan.detail.message) || `失败：HTTP ${r.status}`); return; }

  dialog(`删除${label}`, dlg => {
    dlg.append(el('div', 'msg err',
      '删除是硬删：不进回收站，不可撤销，并且会同步删掉设备上的文件。\n' +
      '设备端如果对这些文档有本地变更，下次同步可能把它们原 UUID 推回来（复活）。'));
    dlg.append(el('div', null, `将删除 ${plan.items.length} 项（先深后浅）：`));
    const list = el('div', 'kids');
    for (const item of plan.items) {
      const line = item.kind === 'folder'
        ? `📁 ${item.name}/`
        : `· ${item.name}  [${item.type || '?'}, ${kb(item.size)}]`;
      list.append(el('div', 'node', '  '.repeat(item.depth) + line));
    }
    dlg.append(list);
  }, '确认删除', async () => {
    const form = new FormData();
    for (const id of roots) form.append('roots', id);
    for (const i of plan.ids) form.append('ids', i);
    const res = await fetch('/api/delete', {method: 'POST', body: form});
    const d = await res.json().catch(() => ({}));
    if (!res.ok) {
      const detail = d.detail || {};
      say('err', detail.reason === 'tree_changed'
        ? `${detail.message}\n（多半是设备同步动过这棵子树，重新点一次删除再看一遍清单）`
        : (detail.message || `失败：HTTP ${res.status}`));
      await load();
      return;
    }
    SELECTED.clear();
    drawBatchBar();
    say(d.residue.length ? 'err' : 'ok', d.residue.length
      ? `已删 ${d.deleted.length} 项，但复查发现 ${d.residue.length} 项还在树上：${d.residue.join(', ')}`
      : `✓ 已删除 ${d.deleted.length} 项，删完立刻复查未见残留。\n` +
        '复活要等设备同步一轮才看得出来——记录已存到本地，过几分钟用上面的「复活复查」再查一次。');
    await loadPending();
    await load();
  });
}

// ---- 重名检测（只报告，不给任何自动删除）----

async function showDuplicates() {
  const box = document.getElementById('dups');
  const r = await fetch('/api/duplicates');
  const d = await r.json().catch(() => ({groups: []}));
  if (!r.ok) { say('err', '重名检测失败，看下终端里的报错'); return; }
  box.hidden = false;
  box.textContent = '';
  const groups = d.groups || [];
  box.append(el('h2', null, `重名检测：${groups.length} 组同名文档`));
  box.append(el('div', 'meta', '同名不等于重复——哪一份该留只有你知道，这里只报告，不提供自动删除。'));
  for (const g of groups) {
    const wrap = el('div', 'group');
    wrap.append(el('div', null, `「${g.name}」×${g.items.length}`));
    for (const item of g.items) {
      const line = el('div', 'item');
      const link = el('a', null, (item.path ? item.path + '/' : '') + item.name);
      link.onclick = () => jumpTo(item.id);
      line.append(link);
      line.append(el('span', 'meta',
        `[${item.type || '?'}, ${kb(item.size)}, ${(item.lastModified || '').slice(0, 10)}]`));
      if (item.locked) line.append(el('span', 'badge', '🔒 只读'));
      wrap.append(line);
    }
    box.append(wrap);
  }
  if (!groups.length) box.append(el('div', null, '没有同名文档。'));
  const close = el('button', null, '收起');
  close.onclick = () => { box.hidden = true; };
  box.append(el('div', null), close);
}

function jumpTo(id) {
  const hit = INDEX.get(id);
  if (!hit) return;
  FILTER = '';
  document.getElementById('search').value = '';
  for (const ancestor of hit.ancestors) OPEN.add(ancestor);   // 展开祖先，否则滚过去也看不见
  draw();
  const row = document.querySelector(`[data-id="${CSS.escape(id)}"]`);
  if (!row) return;
  row.scrollIntoView({block: 'center', behavior: 'smooth'});
  row.classList.add('flash');
  setTimeout(() => row.classList.remove('flash'), 2000);
}

// ---- 待复查的删除记录（存在本地文件里，刷新页面也还在）----

async function loadPending() {
  const box = document.getElementById('pending');
  const r = await fetch('/api/deleted');
  if (!r.ok) { box.hidden = true; return; }
  const records = (await r.json()).records || [];
  box.hidden = !records.length;
  if (!records.length) return;

  box.textContent = '';
  box.append(el('h2', null, `删除记录待复查（${records.length} 项）`));
  box.append(el('div', 'meta',
    '删除是硬删，但设备端对这些文档有本地变更时会把它们原 UUID 推回来（复活）。' +
    '设备同步一轮之后点「复活复查」确认一下，确认干净了就清掉记录。'));
  for (const rec of records) {
    const line = el('div', 'rec');
    const where = rec.path ? rec.path + '/' : '';
    line.append(el('span', null,
      `${rec.kind === 'folder' ? '📁' : '·'} ${where}${rec.name}  ${rec.id}  ${(rec.deleted_at || '').replace('T', ' ').slice(0, 19)}`));
    const drop = el('button', null, '清除');
    drop.onclick = () => clearRecords([rec.id]);
    line.append(document.createTextNode(' '), drop);
    box.append(line);
  }
  const check = el('button', null, '复活复查');
  check.onclick = recheck;
  const clearAll = el('button', null, '全部清除');
  clearAll.onclick = () => clearRecords(null);
  box.append(el('div', null), check, clearAll);
}

async function recheck() {
  const r = await fetch('/api/resurrection', {method: 'POST'});
  const d = await r.json().catch(() => ({back: [], checked: 0}));
  if (!r.ok) { say('err', '复查失败，看下终端里的报错'); return; }
  say(d.back.length ? 'err' : 'ok', d.back.length
    ? `⚠ ${d.back.length} 项被设备端原 UUID 推回来了：\n` +
      d.back.map(b => `  ${b.id}  ${b.path ? b.path + '/' : ''}${b.name}`).join('\n') +
      '\n再删一次，并且删完别在设备上碰它。'
    : `✓ 复查了 ${d.checked} 条记录，没有 UUID 回到树上。确认干净了就点「全部清除」。`);
  await load();
}

async function clearRecords(ids) {
  const body = new FormData();
  for (const i of ids || []) body.append('ids', i);
  await fetch('/api/deleted/clear', {method: 'POST', body});
  await loadPending();
}

// ---- 绑定 ----

document.getElementById('search').oninput = ev => {
  FILTER = ev.target.value.trim().toLowerCase();
  draw();
};
document.getElementById('sort').onchange = ev => { SORT = ev.target.value; draw(); };
document.getElementById('mkroot').onclick = () => askNewFolder('', '根级');
document.getElementById('dupcheck').onclick = showDuplicates;
document.getElementById('reload').onclick = () => { loadPending(); load(); };
loadPending();
load();
</script>
